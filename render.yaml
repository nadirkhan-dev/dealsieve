# One-click deploy on Render (alternative to Cloud Run)
services:
  - type: web
    name: dealsieve
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false   # paste your Supabase/Neon Postgres URL
      - key: DEMO_MODE
        value: "true"
      - key: SEED_DEMO
        value: "true"   # reviewers land on a scored dashboard, not an empty state
      - key: ANTHROPIC_API_KEY
        sync: false

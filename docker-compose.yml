# Local production-like stack: app + Postgres
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dealsieve
      POSTGRES_PASSWORD: dealsieve
      POSTGRES_DB: dealsieve
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealsieve"]
      interval: 3s
      retries: 10
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgresql://dealsieve:dealsieve@db:5432/dealsieve
      DEMO_MODE: ${DEMO_MODE:-true}
      SEED_DEMO: ${SEED_DEMO:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
